[build-system]
# Declared explicitly rather than left to pip's legacy fallback: without this table
# the build backend and its version are whatever the installing tool happens to
# default to, which is not a property a reproducible setup should leave to chance.
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-tracker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "pandas>=2.2",
    "pyyaml>=6.0",
    # Runtime from M2: `providers/` needs a real HTTP client. It was already
    # installed as a dev dependency for FastAPI's test client; two HTTP clients
    # would mean two timeout and TLS configurations.
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13", "types-PyYAML>=6.0"]

[tool.setuptools.packages.find]
# `app` is the only package this distribution ships. Without an explicit include,
# setuptools falls back to flat-layout auto-discovery, which scans backend/ for
# top-level importable directories and refuses to build the moment it finds more
# than one: `data/` (created by the runbook's own setup step, and again by the
# first CLI import) is not on its built-in exclusion list the way `tests/` is.
# The failure is "Multiple top-level packages discovered in a flat-layout" during
# `pip install -e .`, and it strands the install before a single dependency is
# resolved. Naming the package keeps discovery out of the loop entirely.
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# realdata is a separate, opt-in suite (design doc Sec 11.1): a plain `pytest` run
# must not depend on whether the owner's gitignored real exports happen to be
# present on disk. Run it explicitly with `pytest -m realdata`.
addopts = ["-m", "not realdata"]
markers = [
    "realdata: runs against the owner's real DeGiro exports; skipped unless they exist",
]
# Two standing warnings from the locked FastAPI/Starlette test client, neither
# from project code (PT-45). Silenced narrowly, by message, rather than by
# category or module: a blanket ignore would also swallow the next deprecation,
# and standing noise is what trains a reader to stop looking at the warnings
# summary -- which is the whole reason these are worth removing.
#
# Upgrading was tried first and had nothing to offer: on 2026-09-19 the lock was
# already at fastapi 0.141.1 / starlette 1.6.0, and
# `uv lock --upgrade-package starlette --upgrade-package fastapi
#  --upgrade-package anyio` resolved to no change.
filterwarnings = [
    # Starlette 1.6 asks test-client users to swap httpx for httpx2. httpx is a
    # RUNTIME dependency here -- `providers/` needs a real HTTP client, and the
    # note beside it in [project] dependencies is explicit that a second client
    # would mean a second timeout and TLS configuration. Declining for now is a
    # decision, not an oversight; revisit if httpx2 becomes what httpx is.
    #
    # Note the category: despite the name, StarletteDeprecationWarning subclasses
    # UserWarning, so a filter written against DeprecationWarning would miss it
    # and the warning would still appear.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
    # Raised from starlette/testclient.py at import time, reached through
    # fastapi.testclient by the API test modules. Only Starlette can fix it.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pinned explicitly: ruff's default rule set varies by version, and an unpinned
# gate that changes under you is worse than no gate. E/F = pycodestyle+pyflakes,
# I = import order, B = bugbear.
# FURB is deliberately absent: FURB157 rewrites Decimal("1") to Decimal(1), and in
# a codebase whose first rule is "money is Decimal, never float", constructing from
# strings is the habit worth keeping.
select = ["E", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
# B008 (function-call-in-default-argument) can't tell FastAPI's DI factories apart
# from an accidental mutable default: `Depends(get_engine)` runs once per request,
# not once at import time, so it is the one idiomatic exception to that rule.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
