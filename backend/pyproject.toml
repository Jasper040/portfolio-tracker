[project]
name = "portfolio-tracker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.8", "mypy>=1.13"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# realdata is a separate, opt-in suite (design doc Sec 11.1): a plain `pytest` run
# must not depend on whether the owner's gitignored real exports happen to be
# present on disk. Run it explicitly with `pytest -m realdata`.
addopts = ["-m", "not realdata"]
markers = [
    "realdata: runs against the owner's real DeGiro exports; skipped unless they exist",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pinned explicitly: ruff's default rule set varies by version, and an unpinned
# gate that changes under you is worse than no gate. E/F = pycodestyle+pyflakes,
# I = import order, B = bugbear.
# FURB is deliberately absent: FURB157 rewrites Decimal("1") to Decimal(1), and in
# a codebase whose first rule is "money is Decimal, never float", constructing from
# strings is the habit worth keeping.
select = ["E", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
# B008 (function-call-in-default-argument) can't tell FastAPI's DI factories apart
# from an accidental mutable default: `Depends(get_engine)` runs once per request,
# not once at import time, so it is the one idiomatic exception to that rule.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
