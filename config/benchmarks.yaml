# The benchmark set (M3 spec section 4.3). TRACKED, unlike every other config
# file here, because a key below is a slug and names no holding of yours.
#
# This file is an ANSWER, not a lookup. The symbol discriminator that guards
# `instrument_symbols.yaml` cannot run here: it validates a candidate series
# against the ledger's own executed prices, and a benchmark was never traded,
# so there is nothing to check it against. Whatever symbol you write is used.
#
# Keys must be lowercase slugs. Anything ISIN-shaped ANYWHERE in a key is
# refused at load -- not just a key that is entirely an ISIN -- because an ISIN
# in a tracked file is a holding, and this file is tracked. A hyphen breaks the
# run of letters and digits an ISIN needs, so ordinary keys are unaffected.
#
# `ter` is the proxy's total expense ratio in percent per year. It is reported
# beside the comparison, never subtracted from it -- adjusting would invent a
# series nobody published. A holding that beats its proxy by less than the TER
# has not necessarily beaten the index the proxy tracks.
#
# world:
#   symbol: <the symbol your price provider knows>
#   currency: EUR
#   name: <a short label you will recognise on the chart legend>
#   ter: "0.20"

# Chosen for the M3 comparison: the broadest single line available to a EUR
# investor -- one cap-weighted global index spanning both mature and newer
# economies, several thousand constituents, around 90-95% of investable market
# cap worldwide. That is the closest a retail proxy gets to the market
# portfolio, and a cap-weighted whole-market index is the beta-1 line by
# construction.
#
# The EUR-quoted Xetra listing, so the series needs no FX conversion before
# rebasing and the comparison carries no currency effect the owner did not
# actually take.
#
# The label below is deliberately plain. Index-family brand words are real
# tokens in the gitignored export -- they appear in the names of holdings --
# so writing one here fails test_no_real_data_committed however generic it
# looks, and this is the one tracked file in config/. The symbol carries the
# identity; the label only has to be recognisable on a chart legend.
world:
  symbol: VWCE.DE
  currency: EUR
  name: Global market
  ter: "0.22"
